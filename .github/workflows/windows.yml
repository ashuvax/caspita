# בונה את תוכנת ההתקנה לווינדוס (Caspita-Setup-x.y.z.exe, כ-40MB).
# כל push ל-main ו-PR: בנייה + קובץ ההתקנה כ-artifact להורדה מדף הריצה.
# תג v* (למשל v1.2.0): בנוסף נוצרת גרסה (Release) ב-GitHub עם קובץ ההתקנה.
#
# חתימה דיגיטלית (אופציונלי): סודות WINDOWS_CERT_PFX (קובץ PFX ב-base64) ו-WINDOWS_CERT_PASSWORD.
# בלי הסודות — הבנייה עוברת בלי חתימה.
name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      # Chrome לא נארז בהתקנה (יורד בסנכרון הראשון), אז לא צריך אותו גם בבנייה
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            caspita-client/package-lock.json

      - name: NSIS
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: גרסה מהתג
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: התקנת תלויות
        run: |
          npm ci
          npm ci --prefix caspita-client

      - name: בדיקת טיפוסים
        run: npx tsc --noEmit

      - name: בניית תוכנת ההתקנה
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: Caspita-Setup
          path: release/*.exe
          if-no-files-found: error

      - name: פרסום גרסה
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
