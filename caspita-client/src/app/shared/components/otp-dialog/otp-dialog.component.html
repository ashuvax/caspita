<div class="otp-header">
  <div class="otp-icon">
    <mat-icon>sms</mat-icon>
  </div>
  <div class="otp-title-block">
    <h2>אימות דו-שלבי</h2>
    <p>{{ data.bankName }} שלח קוד SMS לטלפון שלך</p>
    <p *ngIf="data.attempt > 1" class="otp-retry">הקוד הקודם נדחה — נסיון {{ data.attempt }} מתוך 3</p>
  </div>
</div>

<mat-dialog-content class="otp-body">
  <mat-form-field appearance="outline" class="otp-field">
    <mat-label>קוד אימות</mat-label>
    <input
      matInput
      [(ngModel)]="code"
      type="text"
      inputmode="numeric"
      maxlength="8"
      placeholder="הזן את הקוד שקיבלת"
      (keydown.enter)="submit()"
      autofocus
    />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions class="otp-actions">
  <button class="btn-cancel" (click)="cancel()">ביטול</button>
  <button class="btn-submit" (click)="submit()" [disabled]="!code.trim()">אשר</button>
</mat-dialog-actions>
