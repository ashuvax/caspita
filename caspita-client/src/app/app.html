<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-mark" aria-hidden="true">₪</span>
      <span class="logo-text">כספיטה</span>
      <ng-container *ngIf="features.alerts$ | async as alerts">
        <button
          class="bell-btn"
          [matMenuTriggerFor]="alertsMenu"
          [class.has-alerts]="alerts.length"
          [attr.aria-label]="alerts.length ? alerts.length + ' עדכונים' : 'אין עדכונים'"
          matTooltip="עדכונים"
        >
          <mat-icon>notifications</mat-icon>
          <span class="bell-count" *ngIf="alerts.length">{{ alerts.length }}</span>
        </button>
        <mat-menu #alertsMenu="matMenu" class="alerts-menu" xPosition="before">
          <div class="alerts-head" (click)="$event.stopPropagation()">עדכונים</div>
          <p class="alerts-empty" *ngIf="!alerts.length" (click)="$event.stopPropagation()">אין עדכונים חדשים</p>
          <button mat-menu-item class="alert-item" *ngFor="let a of alerts" [class]="'tone-' + a.tone" (click)="openAlert(a)">
            <mat-icon class="alert-icon">{{ alertIcon(a) }}</mat-icon>
            <span class="alert-body">
              <strong>{{ a.title }}</strong>
              <span>{{ a.text }}</span>
            </span>
            <span class="alert-close" role="button" aria-label="הסתר" matTooltip="הסתר" (click)="dismiss(a, $event)"><mat-icon>close</mat-icon></span>
          </button>
        </mat-menu>
      </ng-container>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-group" *ngFor="let g of navGroups">
        <span class="nav-group-title" *ngIf="g.title">{{ g.title }}</span>
        <a *ngFor="let item of g.items" class="nav-item" [routerLink]="item.path" routerLinkActive="active">
          <mat-icon>{{ item.icon }}</mat-icon>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <button class="sync-btn" (click)="sync.sync()" [disabled]="(sync.status$ | async)?.running" matRipple>
        <mat-icon [class.spinning]="(sync.status$ | async)?.running">sync</mat-icon>
        <span>{{ (sync.status$ | async)?.running ? 'מסנכרן...' : 'סנכרן עכשיו' }}</span>
      </button>
      <div class="sync-meta" *ngIf="(sync.status$ | async)?.running">{{ syncProgress() }}</div>
      <div class="sync-meta" *ngIf="!(sync.status$ | async)?.running && (sync.status$ | async)?.finishedAt as at">
        סונכרן לאחרונה {{ at | date: 'dd/MM HH:mm' }}
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
